version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: drivesafe
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drivesafe-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - drivesafe-network

  apigateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=server=mysql;database=drivesafe_apigateway;user=root;password=123456
    ports:
      - "7000:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - drivesafe-network

  userservice:
    build:
      context: ./DriveSafe.Users
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=server=mysql;database=drivesafe_user;user=root;password=123456
    ports:
      - "7004:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - drivesafe-network

  vehicleservice:
    build:
      context: ./VehicleService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=server=mysql;database=drivesafe_vehicle;user=root;password=123456
    ports:
      - "7002:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - drivesafe-network

  maintenanceservice:
    build:
      context: ./MaintenanceService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=server=mysql;database=drivesafe_maintenance;user=root;password=123456
    ports:
      - "7001:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - drivesafe-network

  rentservice:
    build:
      context: ./RentService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=server=mysql;database=drivesafe_rent;user=root;password=123456
    ports:
      - "7003:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - drivesafe-network

networks:
  drivesafe-network:
    driver: bridge

volumes:
  mysql_data: